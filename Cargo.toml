[package]
name = "btc-offline-signer"
version = "0.1.0"
edition = "2024"

[dependencies]
bitcoin = { version = "0.32.102", features = ["serde"] }
clap = { version = "4.6.1", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
rustix = { version = "1.1.4", features = ["termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
thiserror = "2.0.21"
zeroize = "1.9.0"

[dev-dependencies]
rustix = { version = "1.1.4", features = ["pty"] }  # terminal tests

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"             # stdout is reserved for the signed hex
float_arithmetic = "deny"         # no floats near money
arithmetic_side_effects = "deny"  # forces checked math
mod_module_files = "deny"         # foo.rs beside foo/, never foo/mod.rs

[profile.release]
overflow-checks = true            # backstop in case checked math is missed
