[package]
name = "btc-offline-signer"
version = "0.1.0"
edition = "2024"

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"             # stdout is reserved for the signed hex
float_arithmetic = "deny"         # no floats near money
arithmetic_side_effects = "deny"  # forces checked math

[profile.release]
overflow-checks = true            # backstop in case checked math is missed
